# Sinopebase Semgrep SAST Configuration
# Focused on TypeScript security, secrets, and OWASP Top Ten.

rules:
  # TypeScript/JavaScript security patterns from semgrep registry
  - id: ts-security-injection
    patterns:
      - pattern-either:
          - pattern: $FN($REQ.query.$PARAM, ...)
          - pattern: $FN($REQ.body.$PARAM, ...)
          - pattern: $FN($REQ.params.$PARAM, ...)
    message: "Untrusted input flowing to sensitive function — potential injection."
    severity: WARNING
    languages: [ts, javascript]

  # No eval / dynamic code execution
  - id: no-eval-or-dynamic-execution
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
          - pattern: $X.$FUNC("child_process", ...)
    message: "Dynamic code execution is dangerous and should be avoided."
    severity: ERROR
    languages: [ts, javascript]

  # SQL injection via string concatenation
  - id: ts-sql-injection-concat
    patterns:
      - pattern-either:
          - pattern: |
              $DB.query("..." + $VAR + "...", ...)
          - pattern: |
              $DB.query(`...${$VAR}...`, ...)
    message: "Potential SQL injection via string concatenation. Use parameterized queries."
    severity: ERROR
    languages: [ts, javascript]

  # Path traversal
  - id: ts-path-traversal
    patterns:
      - pattern-either:
          - pattern: |
              require('fs').readFileSync($REQ.params.$P, ...)
          - pattern: |
              require('fs').readFileSync($REQ.query.$P, ...)
          - pattern: |
              require('fs').readFileSync($REQ.body.$P, ...)
    message: "Potential path traversal. Validate and sanitize file paths from user input."
    severity: ERROR
    languages: [ts, javascript]

  # XSS via unsanitized output
  - id: ts-xss-response
    patterns:
      - pattern-either:
          - pattern: |
              $RES.send($REQ.body.$P)
          - pattern: |
              $RES.send($REQ.query.$P)
          - pattern: |
              $RES.send($REQ.params.$P)
    message: "Potential XSS — unsanitized user input in response."
    severity: WARNING
    languages: [ts, javascript]

  # ─── Elysia Anti-Pattern Rules (from sinopebase-elysia-rules.md) ───────────
  # Rule 4: Unnamed Elysia instances — must have `name` for deduplication
  - id: elysia-unnamed-instance
    patterns:
      - pattern: new Elysia()
      - pattern-not: 'new Elysia({..., name: ..., ...})'
    message: |
      Elysia Rule 4 — Unnamed Elysia instance.
      Every Elysia instance/plugin MUST have a `name` for deduplication.
      Use: `new Elysia({ name: 'sinopebase-<feature>' })`
      See: sinopebase-elysia-rules.md#4-deduplication--always-name-plugins
    severity: WARNING
    languages: [ts]
    paths:
      include:
        - /src/**/*.ts
      exclude:
        - /src/**/*.test.ts

  # Rule 6: JIT-degrading handler pattern — (ctx) instead of destructured params
  # NOTE: This rule is disabled because the arrow-function-with-ellipsis
  # pattern `(ctx) => { ... }` causes a PatternParseError in semgrep v1.x.
  # Re-enable when semgrep adds first-class support for arrow body ellipsis.
  # - id: elysia-no-handler-destructure

  # Rule 12: allowUnsafeValidationDetails must never be true
  - id: elysia-unsafe-validation-details
    patterns:
      - pattern: |
          Elysia.allowUnsafeValidationDetails = true
    message: |
      Elysia Rule 12 — Unsafe validation details enabled.
      Never set allowUnsafeValidationDetails = true in production.
      This leaks schema structure in validation error responses.
    severity: ERROR
    languages: [ts]
    paths:
      include:
        - /src/**/*.ts

  # Rule 19: CORS alignment — detect allowOrigins: ['*'] (becomes ERROR if extraOrigins is also set)
  - id: elysia-wildcard-cors
    patterns:
      - pattern: |
          allowOrigins: ['*']
    message: |
      Elysia Rule 19 — CORS allowOrigins is ['*'].
      Wildcard CORS allows any origin. Must match better-auth trustedOrigins.
      Restrict to specific origins for production.
      See: sinopebase-elysia-rules.md#19-better-auth--cors--trusted-origins
    severity: WARNING
    languages: [ts]
    paths:
      include:
        - /src/**/*.ts

  # Security: process.env write-back after caching (secrets leak to child processes)
  - id: security-env-writeback-secrets
    patterns:
      - pattern-either:
          - pattern: |
              process.env.JWT_SECRET = ...
          - pattern: |
              process.env.SINOPEBASE_SERVICE_ROLE_KEY = ...
          - pattern: |
              process.env.SINOPEBASE_ANON_KEY = ...
    message: |
      Secrets written back to process.env after caching — leaks to child processes.
      Remove the process.env write-back. Secrets should only live in class properties
      after initial cache, never in the global environment.
    severity: ERROR
    languages: [ts]
    paths:
      include:
        - /src/**/*.ts

  # Security: JWT dev fallback duplicated (risk of inconsistent values)
  - id: security-jwt-fallback-duplicated
    patterns:
      - pattern-either:
          - pattern: sinopebase-dev-jwt-secret-min-32-chars!!
          - pattern: sinopebase-dev-secret-min-32-chars!!
    message: |
      JWT dev fallback secret is duplicated across files with inconsistent values.
      Export a single shared constant JWT_DEV_FALLBACK from src/core/constants.ts
      and import it everywhere.
    severity: WARNING
    languages: [ts]
    paths:
      include:
        - /src/**/*.ts

  # Security: Health endpoint leaking infrastructure details in production
  - id: security-health-endpoint-leak
    patterns:
      - pattern-either:
          - pattern: |
              mode: this.mode
          - pattern: |
              db: this.database instanceof PostgresDatabase
          - pattern: |
              storage: this.fileStore instanceof S3FileStore
    message: |
      Health endpoint may leak infrastructure details (mode, db type, storage type).
      In production, return only `{ code: 200, message: 'running' }`.
    severity: WARNING
    languages: [ts]
    paths:
      include:
        - /src/**/*.ts

paths:
  include:
    - /src/**/*.ts
    - /tests/**/*.ts
  exclude:
    - /node_modules/
    - /dist/
    - /ui/
    - /.claude/
    - "*.d.ts"
