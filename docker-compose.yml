# Sinopebase development infrastructure
# Start with: docker compose up -d
# Stop with:  docker compose down
#
# Production uses Railway-hosted PostgreSQL and Railway Buckets.
# See .env.railway for production variable configuration.
# For local dev that mirrors production, set POSTGRES_URL and RUSTFS_*
# env vars to your Railway services and run `bun run dev` directly.

services:
  # PostgreSQL 18 — for local dev when not using Railway-hosted PG.
  # Commented out by default since production uses Railway PostgreSQL.
  # Uncomment and run `docker compose up -d postgres` for offline dev.
  # postgres:
  #   image: postgres:18.4-alpine
  #   container_name: sinopebase-pg
  #   environment:
  #     POSTGRES_USER: sinopebase
  #     POSTGRES_PASSWORD: sinopebase
  #     POSTGRES_DB: sinopebase
  #   ports:
  #     - '5432:5432'
  #   volumes:
  #     - pgdata:/var/lib/postgresql
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U sinopebase']
  #     interval: 2s
  #     timeout: 3s
  #     retries: 10

  # RustFS — S3-compatible object storage for local dev.
  # Production uses Railway Buckets (S3-compatible).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: sinopebase-storage
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # Web console
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # PgBouncer — only needed when running local PG
  # pgbouncer:
  #   image: edoburu/pgbouncer:latest
  #   container_name: sinopebase-pgbouncer
  #   environment:
  #     DB_HOST: postgres
  #     DB_USER: sinopebase
  #     DB_PASSWORD: sinopebase
  #     DB_NAME: sinopebase
  #     MAX_CLIENT_CONN: '100'
  #     DEFAULT_POOL_SIZE: '25'
  #   ports:
  #     - '6432:5432'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  pgdata:
  storagedata:
