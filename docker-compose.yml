# Sinopebase local development infrastructure
# Start with: docker compose up -d
# Stop with:  docker compose down
#
# This compose file starts everything: PostgreSQL, RustFS (S3), PgBouncer,
# and Sinopebase itself. The app service builds from the local Dockerfile
# or runs `bun run dev` for hot-reload development.
#
# To connect to Railway services instead, set these env vars:
#   POSTGRES_URL, S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET
# Then run `bun run dev` directly without docker compose.

services:
  # PostgreSQL 18 — local dev database, mirrors Railway Sinope-PG-Prod
  postgres:
    image: postgres:18.4-alpine
    command: "postgres -c max_connections=300"
    container_name: sinopebase-pg
    environment:
      POSTGRES_USER: sinopebase
      POSTGRES_PASSWORD: sinopebase
      POSTGRES_DB: sinopebase
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sinopebase']
      interval: 2s
      timeout: 3s
      retries: 10

  # Mailpit — local SMTP test server with a REST API for received mail
  # SMTP: localhost:1025 (no auth), API: http://localhost:8025/api/v1
  mail:
    image: axllent/mailpit:latest
    container_name: sinopebase-mail
    ports:
      - '1025:1025'
      - '8025:8025'

  # RustFS — S3-compatible object storage, mirrors Railway Buckets
  rustfs:
    image: rustfs/rustfs:latest
    container_name: sinopebase-storage
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # Web console
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # PgBouncer — connection pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sinopebase-pgbouncer
    environment:
      DB_HOST: postgres
      DB_USER: sinopebase
      DB_PASSWORD: sinopebase
      DB_NAME: sinopebase
      MAX_CLIENT_CONN: '100'
      DEFAULT_POOL_SIZE: '25'
    ports:
      - '6432:5432'
    depends_on:
      postgres:
        condition: service_healthy

  # Sinopebase — the app itself
  sinopebase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sinopebase-app
    ports:
      - '8090:8090'
    environment:
      POSTGRES_URL: postgresql://sinopebase:sinopebase@postgres:5432/sinopebase
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      JWT_SECRET: ${JWT_SECRET:-sinopebase-dev-jwt-secret-min-32-chars!!}
      SINOPEBASE_SERVICE_ROLE_KEY: ${SINOPEBASE_SERVICE_ROLE_KEY:-test-service-role-key-min-32-chars!!}
      SINOPEBASE_ANON_KEY: ${SINOPEBASE_ANON_KEY:-test-anon-key-min-32-characters!!!}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  storagedata:
