name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write # Required for SARIF upload (code scanning)

jobs:
  # ─── Stage 0: Audit (runs first, fast fail) ───────────────────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Bun audit (dependency vulnerabilities)
        run: bun audit
      - name: Verify lockfile integrity
        run: bun install --frozen-lockfile

  # ─── Stage 1: Quality Gates (parallel) ────────────────────────────────
  lint:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - name: Biome format check
        run: bun run format:check
      - name: "Biome lint (noExplicitAny enforced as error)"
        run: bun run lint
      - name: ESLint (JS files + security plugin)
        run: bun run lint:eslint
      - name: Generate ESLint SARIF
        run: bun run lint:eslint:sarif
      - name: Upload ESLint SARIF
        if: hashFiles('eslint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          category: eslint
      - name: "Validate workflow YAML"
        run: bun run lint:yaml

  typecheck:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - run: cd ui && bun install --frozen-lockfile
      - name: "TypeScript typecheck (regression gate — fails only on NEW errors)"
        run: bun run typecheck:ci

  jscpd:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - name: Copy-paste detection (jscpd)
        run: bun run lint:jscpd

  # ─── Stage 2: Security Gates (parallel, needs Stage 1) ────────────────
  semgrep:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST scan (security + elysia conventions)
        run: semgrep scan --config p/typescript --config p/secrets --config .semgrep.yml --severity ERROR

  gitleaks:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history
      - name: Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENT: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  megalinter:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MegaLinter (orchestrated lint/security)
        uses: oxsecurity/megalinter/flavors/ci_light@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .mega-linter.yml

  # ─── Stage 3: Test Suite (needs Stage 1) ──────────────────────────────
  test:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        command: "postgres -c max_connections=300"
        env:
          POSTGRES_USER: sinopebase
          POSTGRES_PASSWORD: sinopebase
          POSTGRES_DB: sinopebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: rustfsadmin
          RUSTFS_ROOT_PASSWORD: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mail:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U sinopebase; do sleep 2; done
      - name: Wait for RustFS
        run: until wget -q --spider http://localhost:9000/health; do sleep 2; done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run test suite (JUnit, PostgreSQL-backed)
        run: |
          export SINOPEBASE_SERVICE_ROLE_KEY=$(openssl rand -hex 32)
          export SINOPEBASE_ANON_KEY=$(openssl rand -hex 32)
          export JWT_SECRET=$(openssl rand -hex 32)
          bun run test:ci
        env:
          TEST_POSTGRES_URL: postgresql://sinopebase:sinopebase@localhost:5432/sinopebase
          RUSTFS_ENDPOINT: http://localhost:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin

      - name: Publish test results (JUnit)
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Bun Test Results
          path: junit.xml
          reporter: java-junit

  # ─── Stage 3b: Browser E2E (Playwright, needs Stage 1) ────────────────
  e2e:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        command: "postgres -c max_connections=300"
        env:
          POSTGRES_USER: sinopebase
          POSTGRES_PASSWORD: sinopebase
          POSTGRES_DB: sinopebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: rustfsadmin
          RUSTFS_ROOT_PASSWORD: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mail:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U sinopebase; do sleep 2; done
      - name: Wait for RustFS
        run: until wget -q --spider http://localhost:9000/health; do sleep 2; done
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E suite
        run: bun run test:e2e
        env:
          TEST_POSTGRES_URL: postgresql://sinopebase:sinopebase@localhost:5432/sinopebase
          RUSTFS_ENDPOINT: http://localhost:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          SINOPEBASE_SERVICE_ROLE_KEY: e2e-key-service-min-32-chars!!
          SINOPEBASE_ANON_KEY: e2e-key-anon-min-32-chars!!!!!

  # ─── Stage 4: SDK package check + Container (needs Stage 2 + 3) ─────
  sdk-check:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK package is publishable
        run: cd sdk-package && npm publish --dry-run

  docker:
    needs: [semgrep, gitleaks, megalinter, test, sdk-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sinopebase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sinopebase:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

  # ─── Deploy (Railway autodeploy with Wait for CI — no CI steps needed) ──
  # Railway watches `master` and deploys when all CI jobs pass.
  # Configured in Railway dashboard: Service Settings → Wait for CI.
  # No RAILWAY_TOKEN, deploy steps, or smoketests needed here —
  # Railway healthchecks and restart policies handle that natively.
