name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: read
  security-events: write # Required for SARIF upload (code scanning)

jobs:
  # ─── Stage 0: Audit (runs first, fast fail) ───────────────────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Bun audit (dependency vulnerabilities)
        run: bun audit
      - name: Verify lockfile integrity
        run: bun install --frozen-lockfile

  # ─── Stage 1: Quality Gates (parallel) ────────────────────────────────
  lint:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - name: Biome format check
        run: bun run format:check
      - name: "Biome lint (noExplicitAny enforced as error)"
        run: bun run lint
      - name: ESLint (JS files + security plugin)
        run: bun run lint:eslint
      - name: Generate ESLint SARIF
        run: bun run lint:eslint:sarif
      - name: Upload ESLint SARIF
        if: hashFiles('eslint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          category: eslint
      - name: "Validate workflow YAML"
        run: bun run lint:yaml

  typecheck:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - run: cd ui && bun install --frozen-lockfile
      - name: "TypeScript typecheck (regression gate — fails only on NEW errors)"
        run: bun run typecheck:ci

  jscpd:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile
      - name: Copy-paste detection (jscpd)
        run: bun run lint:jscpd

  # ─── Stage 2: Security Gates (parallel, needs Stage 1) ────────────────
  semgrep:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST scan
        run: semgrep scan --config p/typescript --config p/secrets --config .semgrep.yml --sarif --output semgrep-results.sarif src/ tests/

  gitleaks:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history
      - name: Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENT: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  megalinter:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MegaLinter (orchestrated lint/security)
        uses: oxsecurity/megalinter/flavors/ci_light@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .mega-linter.yml

  # ─── Stage 3: Test Suite (needs Stage 1) ──────────────────────────────
  test:
    needs: [lint, typecheck, jscpd]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: sinopebase
          POSTGRES_PASSWORD: sinopebase
          POSTGRES_DB: sinopebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: rustfsadmin
          RUSTFS_ROOT_PASSWORD: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true
      - run: bun install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U sinopebase; do sleep 2; done
      - name: Wait for RustFS
        run: until wget -q --spider http://localhost:9000/health; do sleep 2; done

      - name: Generate CI test keys
        id: keys
        run: |
          echo "SINOPEBASE_SERVICE_ROLE_KEY=$(openssl rand -hex 32 | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "SINOPEBASE_ANON_KEY=$(openssl rand -hex 32 | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "JWT_SECRET=$(openssl rand -hex 32 | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Run test suite (JUnit, PostgreSQL-backed)
        run: bun run test:ci
        env:
          TEST_POSTGRES_URL: postgresql://sinopebase:sinopebase@localhost:5432/sinopebase
          SINOPEBASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.SINOPEBASE_SERVICE_ROLE_KEY }}
          SINOPEBASE_ANON_KEY: ${{ steps.keys.outputs.SINOPEBASE_ANON_KEY }}
          JWT_SECRET: ${{ steps.keys.outputs.JWT_SECRET }}
          RUSTFS_ENDPOINT: http://localhost:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin

      - name: Publish test results (JUnit)
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Bun Test Results
          path: junit.xml
          reporter: java-junit

  # ─── Stage 4: Container (needs Stage 2 + 3) ───────────────────────────
  docker:
    needs: [semgrep, gitleaks, megalinter, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sinopebase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sinopebase:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─── Stage 5: Deploy (needs Stage 4, human approval via Environment) ──
  deploy-staging:
    needs: docker
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    container:
      image: ghcr.io/railwayapp/cli:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: sh
        run: railway up --detach

  deploy-preview:
    needs: docker
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview
    container:
      image: ghcr.io/railwayapp/cli:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Railway preview environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: sh
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Setting up preview environment for PR #${PR_NUMBER}"
          railway environment new "pr-${PR_NUMBER}" \
            --copy "${{ vars.RAILWAY_SOURCE_ENV_ID }}" \
            --service-config "${{ vars.RAILWAY_SERVICE_ID }}" \
            "source.branch" "${{ github.head_ref }}" || true
          railway up --environment "pr-${PR_NUMBER}" --detach || railway up --detach
      - name: Get preview URL
        id: preview-url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: sh
        run: |
          URL=$(railway status --json 2>/dev/null | jq -r '.url // empty' 2>/dev/null || echo "")
          echo "url=${URL:-deploying}" >> "$GITHUB_OUTPUT"
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview-url.outputs.url }}';
            const prNumber = context.issue.number;
            const body = '## Preview Deployed\n\n' +
              (url !== 'deploying' ? '**Preview URL:** ' + url : 'Preview is being deployed. Check the Railway dashboard for status.') +
              '\n\n_Environment: `pr-' + prNumber + '` will be cleaned up when this PR is merged or closed._';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup Railway preview environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        shell: sh
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Cleaning up preview environment for PR #${PR_NUMBER}"
          railway environment delete "pr-${PR_NUMBER}" || true
          echo "::notice::Preview environment pr-${PR_NUMBER} cleaned up"

  smoketest:
    needs: deploy-staging
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Health check endpoint
        run: |
          echo "Waiting for deployment health check..."
          sleep 15
          HEALTH_STATUS=$(curl -sfS -o /dev/null -w "%{http_code}" \
            --retry 10 --retry-delay 5 --retry-connrefused \
            "https://${{ vars.RAILWAY_STAGING_URL }}/api/health" 2>/dev/null || echo "000")
          if [ "$HEALTH_STATUS" = "200" ]; then
            echo "::notice::Health check passed (HTTP ${HEALTH_STATUS})"
          else
            echo "::error::Health check failed (HTTP ${HEALTH_STATUS})"
            exit 1
          fi
      - name: Readiness check endpoint
        run: |
          READY_STATUS=$(curl -sfS -o /dev/null -w "%{http_code}" \
            --retry 6 --retry-delay 5 \
            "https://${{ vars.RAILWAY_STAGING_URL }}/api/ready" 2>/dev/null || echo "000")
          if [ "$READY_STATUS" = "200" ]; then
            echo "::notice::Readiness check passed (HTTP ${READY_STATUS})"
          else
            echo "::error::Readiness check failed (HTTP ${READY_STATUS})"
            exit 1
          fi
