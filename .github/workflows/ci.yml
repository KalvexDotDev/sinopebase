name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sinopebase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/sinopebase_test
          SINOPEBASE_SERVICE_ROLE_KEY: ${{ secrets.SINOPEBASE_SERVICE_ROLE_KEY }}
          SINOPEBASE_ANON_KEY: ${{ secrets.SINOPEBASE_ANON_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sinopebase:ci .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sinopebase:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
