name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ─── Compile binaries per platform ─────────────────────────────────
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sinopebase-linux-x64
          - os: macos-14            # Apple Silicon (arm64)
            artifact: sinopebase-darwin-arm64
          - os: windows-latest
            artifact: sinopebase-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build admin UI
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Compile binary
        run: bun build cmd/serve.ts --compile --minify --target bun --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ─── Docker image → GHCR (public, for Railway deploys) ─────────────
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Make package public
        run: |
          # Strip the tag prefix for API call
          TAG="${{ github.ref_name }}"
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/$(echo ${{ github.repository }} | cut -d/ -f2)/visibility" \
            -d '{"visibility":"public"}'

  # ─── Create release and attach binaries ────────────────────────────
  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sinopebase-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: sha256sum sinopebase-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            sinopebase-linux-x64
            sinopebase-darwin-arm64
            sinopebase-windows-x64.exe
            checksums.txt
