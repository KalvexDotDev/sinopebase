name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Compile binaries per platform ─────────────────────────────────
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sinopebase-linux-x64
          - os: macos-14            # Apple Silicon (arm64)
            artifact: sinopebase-darwin-arm64
          - os: windows-latest
            artifact: sinopebase-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build admin UI
        run: |
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Compile binary
        run: bun build cmd/serve.ts --compile --minify --target bun --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ─── Create release and attach binaries ────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sinopebase-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: sha256sum sinopebase-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            sinopebase-linux-x64
            sinopebase-darwin-arm64
            sinopebase-windows-x64.exe
            checksums.txt
